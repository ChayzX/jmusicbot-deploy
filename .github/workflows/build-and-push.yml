name: Build and Push Release Notifier Image

on:
  push:
    branches: [main]
    paths:
      - 'release-notifier/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./release-notifier
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jmusicbot-release-notifier:latest
