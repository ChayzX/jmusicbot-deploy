services:
  jmusicbot:
    image: ghcr.io/arif-banai/musicbot:latest
    container_name: jmusicbot
    volumes:
      - ${HOME}/docker/jmusicbot:/musicbot
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Polls arif-banai/MusicBot's GitHub releases and posts new release notes
  # to a Discord webhook (informational channel post, not the alerting bot).
  release-notifier:
    image: ghcr.io/chayzx/jmusicbot-release-notifier:latest
    container_name: jmusicbot-release-notifier
    volumes:
      - ${HOME}/docker/jmusicbot/release-notifier-data:/data
    env_file:
      - .env
    environment:
      - POLL_INTERVAL_SECONDS=900
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# No per-stack Watchtower here. This host already runs one Watchtower
# instance (deployed with the Twitch bot, --label-enable) that hunts down
# and REMOVES any other Watchtower container it finds -- running a second
# instance, even scoped/uniquely-named, gets it killed within one poll
# cycle. The existing instance's --label-enable scanning is host-wide, so
# it already picks up jmusicbot/release-notifier via the
# com.centurylinklabs.watchtower.enable label above regardless of which
# compose project started them. If that instance is ever removed, redeploy
# it (see the Twitch bot repo's watchtower service) rather than adding a
# new one here.
#
# Dashboard/alerting for the jmusicbot container itself is handled
# separately by the shared observability stack (monitors this container
# by name alongside the Twitch bot and host health) -- not duplicated here.
